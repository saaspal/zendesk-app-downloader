<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zendesk App Downloader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h3>Zendesk App Downloader</h3>

    <div id="status">Loading…</div>

    <div id="version-box" hidden>
      <select id="version-list" size="5"></select>
      <div style="margin:10px 0;">
        <label style="display:flex; align-items:center; font-size:13px; cursor:pointer;">
          <input type="checkbox" id="advanced-mode" style="margin-right:5px; margin-top:0;" />
          Download with React Boilerplate
        </label>
        <label style="display:flex; align-items:center; font-size:13px; cursor:pointer; margin-top:5px;">
          <input type="checkbox" id="exclude-json" style="margin-right:5px; margin-top:0;" />
          Exclude App Builder JSON Files
        </label>
      </div>
      <button id="download-btn" disabled>Download ZIP</button>
    </div>

    <pre id="error" class="error" hidden></pre>

    <!-- JSZip library -->
    <script src="jszip.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
